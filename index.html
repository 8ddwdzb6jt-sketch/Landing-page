<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avenchie - أتمتة خدمة العملاء الذكية</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        h1 {
            font-size: 2.5rem;
            color: #00f0ff;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2rem;
            color: #a0aec0;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #00f0ff;
            color: #0b0f19;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>مرحباً بك في Avenchie</h1>
        <p>مستقبل أتمتة خدمة العملاء بين يديك. نحن نبني حلولاً ذكية ومتطورة لرفع كفاءة أعمالك التجارية بدقة وسرعة.</p>
        <a href="#" class="btn">تواصل معنا قريباً</a>
    </div>
</body>
</html>
