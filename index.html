<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز استشارة مجانية</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .booking-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
        }

        .booking-card h2 {
            color: #1a252f;
            text-align: center;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .booking-card p {
            color: #666;
            text-align: center;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: #25D366;
        }

        .btn-submit {
            width: 100%;
            background-color: #25D366;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: #1ebc57;
        }

        .btn-submit:disabled {
            background-color: #a8e6cf;
            cursor: not-allowed;
        }

        #statusMessage {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .success { color: #27ae60; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>

    <div class="booking-card">
        <h2>احجز استشارتك المجانية</h2>
        <p>أدخل بياناتك وسنرسل لك تأكيد الحجز فوراً عبر الواتساب</p>

        <form id="bookingForm">
            <div class="form-group">
                <label for="fullName">الاسم الكامل</label>
                <input type="text" id="fullName" placeholder="أدخل اسمك" required>
            </div>

            <div class="form-group">
                <label for="phoneNumber">رقم الواتساب (مع الرمز الدولي)</label>
                <input type="tel" id="phoneNumber" placeholder="مثال: 966500000000" required>
            </div>

            <div class="form-group">
                <label for="bookingDate">تاريخ ووقت الاستشارة المناسب</label>
                <input type="datetime-local" id="bookingDate" required>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">تأكيد حجز الاستشارة المجانية</button>
        </form>

        <div id="statusMessage"></div>
    </div>

    <script>
        // =========================================================
        // ⚠️ إعدادات حساب Whapi.cloud الخاصة بك
        // استبدل القيمة اللي بين التنصيص بالـ API Token الخاص بك من Whapi
        // =========================================================
        const WHAPI_TOKEN = "ضع_الـ_TOKEN_الخاص_بـ_WHAPI_هنا"; 

        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMessage');

            // جلب البيانات من المدخلات
            const name = document.getElementById('fullName').value.trim();
            let phone = document.getElementById('phoneNumber').value.trim().replace(/[^0-9]/g, '');
            const rawDate = document.getElementById('bookingDate').value;

            // تنسيق بسيط للوقت واليوم
            const formattedDate = rawDate ? rawDate.replace('T', ' الساعة ') : '';

            // نص الرسالة التي ستصل للعميل على الواتساب
            const messageText = `أهلاً بك أستاذ/ة ${name} 👋\n\nتم تأكيد حجز استشارتك المجانية بنجاح! 🎉\n📅 الموعد: ${formattedDate}\n\nسنتواصل معك في الموعد المحدد. شكراً لتواصلك معنا!`;

            // تجهيز زِر الإرسال وحالة الانتظار
            submitBtn.disabled = true;
            submitBtn.innerText = 'جاري إرسال تأكيد الحجز...';
            statusMsg.innerText = '';

            try {
                // إرسال الطلب مباشرة لـ Whapi API
                const response = await fetch('https://gate.whapi.cloud/messages/text', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${WHAPI_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        to: `${phone}@s.whatsapp.net`,
                        body: messageText
                    })
                });

                if (response.ok) {
                    statusMsg.className = 'success';
                    statusMsg.innerText = '✅ تم تأكيد الحجز بنجاح! أرسلنا لك رسالة تأكيد على الواتساب.';
                    document.getElementById('bookingForm').reset();
                } else {
                    const errorData = await response.json();
                    console.error('Whapi Error:', errorData);
                    statusMsg.className = 'error';
                    statusMsg.innerText = '❌ حدث خطأ أثناء إرسال الرسالة. يرجى التأكد من صحة رقم الهاتف.';
                }
            } catch (err) {
                console.error('Fetch Error:', err);
                statusMsg.className = 'error';
                statusMsg.innerText = '❌ تعذر الاتصال بالخدمة. يرجى المحاولة لاحقاً.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'تأكيد حجز الاستشارة المجانية';
            }
        });
    </script>
</body>
</html>
